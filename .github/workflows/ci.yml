# Checks that don't need Civil 3D. The C# plugin isn't built here: it needs Autodesk's DLLs, so the prebuilt
# release DLL is checked instead, and every tool is still matched against its C# handler.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python tests (${{ matrix.python }})
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: mcp-server/requirements.txt
      - name: Install the MCP server's packages
        run: python -m pip install -r mcp-server/requirements.txt
      - name: Catalogue vs C# handlers, protocol, modes, search, drawing lock, preview, verify after write
        run: python mcp-server/tests/test_server.py

  checks:
    name: Scripts, release DLL, tool reference
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: mcp-server/requirements.txt
      - name: Install the MCP server's packages
        run: python -m pip install -r mcp-server/requirements.txt
      - name: Repository checks
        run: python scripts/ci_checks.py
